$kind: http-request
url: "{{baseUrl}}/api/v1/categories"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('data là mảng', () => pm.expect(pm.response.json().data).to.be.an('array'));
    language: text/javascript
order: 1000
