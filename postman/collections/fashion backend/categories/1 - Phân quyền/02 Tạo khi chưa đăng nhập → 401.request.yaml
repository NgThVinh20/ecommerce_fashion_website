$kind: http-request
url: "{{baseUrl}}/api/v1/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "X"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
