$kind: http-request
url: "{{baseUrl}}/api/v1/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "   Thời trang nam (test)   "
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 409', () => pm.response.to.have.status(409));
      pm.test('Mã lỗi CATEGORY_EXISTS', () => pm.expect(pm.response.json().error.code).to.eql('CATEGORY_EXISTS'));
    language: text/javascript
order: 7000
