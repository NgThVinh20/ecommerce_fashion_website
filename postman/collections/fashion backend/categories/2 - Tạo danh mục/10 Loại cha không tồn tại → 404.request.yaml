$kind: http-request
url: "{{baseUrl}}/api/v1/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "X",
      "id_categories_parent": 99999999
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 404', () => pm.response.to.have.status(404));
      pm.test('Mã lỗi PARENT_NOT_FOUND', () => pm.expect(pm.response.json().error.code).to.eql('PARENT_NOT_FOUND'));
    language: text/javascript
order: 10000
