$kind: http-request
url: "{{baseUrl}}/api/v1/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "X",
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi INVALID_JSON (nhánh products trở đi)', () => pm.expect(pm.response.json().error.code).to.eql('INVALID_JSON'));
    language: text/javascript
order: 20000
