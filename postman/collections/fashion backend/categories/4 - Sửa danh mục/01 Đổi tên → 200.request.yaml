$kind: http-request
url: "{{baseUrl}}/api/v1/admin/categories/{{catL2}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "Áo nam"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Tên mới', () => pm.expect(pm.response.json().data.category_name).to.eql('Áo nam'));
    language: text/javascript
order: 1000
