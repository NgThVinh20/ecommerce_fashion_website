$kind: http-request
name: 06 Gửi kèm id_categories_parent → bị bỏ qua, không đổi cha
url: "{{baseUrl}}/api/v1/admin/categories/{{catL2}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "Áo nam",
      "id_categories_parent": {{catL1b}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Cha giữ nguyên', () => pm.expect(pm.response.json().data.id_categories_parent).to.eql(Number(pm.environment.get('catL1'))));
    language: text/javascript
order: 6000
