$kind: http-request
url: "{{baseUrl}}/api/v1/admin/categories/99999999"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "X"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 404', () => pm.response.to.have.status(404));
      pm.test('Mã lỗi CATEGORY_NOT_FOUND', () => pm.expect(pm.response.json().error.code).to.eql('CATEGORY_NOT_FOUND'));
    language: text/javascript
order: 10000
