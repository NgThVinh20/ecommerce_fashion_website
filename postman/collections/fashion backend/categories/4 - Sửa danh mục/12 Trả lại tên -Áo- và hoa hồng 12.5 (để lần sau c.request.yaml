$kind: http-request
name: 12 Trả lại tên "Áo" và hoa hồng 12.5 (để lần sau chạy lại được)
url: "{{baseUrl}}/api/v1/admin/categories/{{catL2}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "Áo",
      "commission_rate": 12.5
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Đã trả về tên Áo', () => pm.expect(pm.response.json().data.category_name).to.eql('Áo'));
    language: text/javascript
order: 12000
