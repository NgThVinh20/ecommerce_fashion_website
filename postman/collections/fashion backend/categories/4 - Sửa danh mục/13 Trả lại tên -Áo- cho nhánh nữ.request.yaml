$kind: http-request
name: 13 Trả lại tên "Áo" cho nhánh nữ
url: "{{baseUrl}}/api/v1/admin/categories/{{catL2b}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "Áo"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 13000
