$kind: http-request
name: 06 Giá lẻ / tồn kho âm → 400
url: "{{baseUrl}}/api/v1/seller/products"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: product_name
      value: Áo Thun Cotton Basic
    - type: text
      key: id_category
      value: "{{leafCat}}"
    - type: text
      key: description
      value: Áo thun 100% cotton
    - type: text
      key: attributes
      value: '{"Chất liệu": "Cotton", "Xuất xứ": "Việt Nam"}'
    - type: text
      key: skus
      value: '[{"sku_code": "X3", "size": "M", "color": "Đen", "price": 1500.5, "stock": -1}]'
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
