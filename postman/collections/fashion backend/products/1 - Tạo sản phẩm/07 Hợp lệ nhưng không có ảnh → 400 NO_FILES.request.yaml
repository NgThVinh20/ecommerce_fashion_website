$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: product_name
      value: Áo Thun Cotton Basic
    - type: text
      key: id_category
      value: "{{leafCat}}"
    - type: text
      key: description
      value: Áo thun 100% cotton
    - type: text
      key: attributes
      value: '{"Chất liệu": "Cotton", "Xuất xứ": "Việt Nam"}'
    - type: text
      key: skus
      value: '[{"sku_code": "AT-{{ts}}-DO-M", "size": "M", "color": "Đỏ", "price": 199000, "stock": 10}, {"sku_code": "AT-{{ts}}-DO-L", "size": "L", "color": "Đỏ", "price": 209000, "stock": 5}]'
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi NO_FILES', () => pm.expect(pm.response.json().error.code).to.eql('NO_FILES'));
    language: text/javascript
order: 7000
