$kind: http-request
url: "{{baseUrl}}/api/v1/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "Con {{ts}}",
      "id_categories_parent": {{leafCat}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi CATEGORY_HAS_PRODUCTS', () => pm.expect(pm.response.json().error.code).to.eql('CATEGORY_HAS_PRODUCTS'));
    language: text/javascript
order: 10000
