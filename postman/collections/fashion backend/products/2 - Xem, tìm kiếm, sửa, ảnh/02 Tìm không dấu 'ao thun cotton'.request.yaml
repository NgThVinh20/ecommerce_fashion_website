$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products?q=ao thun cotton"
method: GET
queryParams:
  q: ao thun cotton
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Tìm thấy', () => pm.expect(pm.response.json().data.map(p => p.id_product)).to.include(Number(pm.environment.get('productId'))));
    language: text/javascript
order: 2000
