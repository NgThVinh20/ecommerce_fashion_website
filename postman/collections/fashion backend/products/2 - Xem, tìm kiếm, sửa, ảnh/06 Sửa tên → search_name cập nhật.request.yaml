$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}"
method: PATCH
body:
  type: formdata
  content:
    - type: text
      key: product_name
      value: Áo Thun Cổ Tròn Đẹp
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('search_name mới', () => pm.expect(d.search_name).to.eql('ao thun co tron dep'));
      pm.test('Ảnh giữ nguyên', () => pm.expect(d.images[0]).to.eql(pm.environment.get('productImg')));
    language: text/javascript
order: 6000
