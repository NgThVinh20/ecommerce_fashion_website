$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('max_price = 259000', () => pm.expect(d.max_price).to.eql('259000'));
    language: text/javascript
order: 2000
