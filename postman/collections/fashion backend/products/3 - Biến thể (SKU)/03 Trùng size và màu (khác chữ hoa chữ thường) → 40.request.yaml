$kind: http-request
name: 03 Trùng size và màu (khác chữ hoa chữ thường) → 409
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}/skus"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: sku_code
      value: AT-{{ts}}-X
    - type: text
      key: size
      value: xl
    - type: text
      key: color
      value: đen
    - type: text
      key: price
      value: "1000"
    - type: text
      key: stock
      value: "1"
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 409', () => pm.response.to.have.status(409));
      pm.test('Mã lỗi SKU_VARIANT_EXISTS', () => pm.expect(pm.response.json().error.code).to.eql('SKU_VARIANT_EXISTS'));
    language: text/javascript
order: 3000
