$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}/skus/{{skuId}}"
method: PATCH
body:
  type: formdata
  content:
    - type: text
      key: remove_image
      value: "true"
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('image_url = null', () => pm.expect(d.image_url).to.eql(null));
    language: text/javascript
order: 9000
