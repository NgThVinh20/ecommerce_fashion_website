$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}/skus/{{skuId3}}"
method: PATCH
body:
  type: formdata
  content:
    - type: text
      key: is_active
      value: "false"
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 10000
