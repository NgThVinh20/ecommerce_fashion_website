$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}/skus/99999999"
method: PATCH
body:
  type: formdata
  content:
    - type: text
      key: stock
      value: "1"
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 404', () => pm.response.to.have.status(404));
      pm.test('Mã lỗi SKU_NOT_FOUND', () => pm.expect(pm.response.json().error.code).to.eql('SKU_NOT_FOUND'));
    language: text/javascript
order: 12000
