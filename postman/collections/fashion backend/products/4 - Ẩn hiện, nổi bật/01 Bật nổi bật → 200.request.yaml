$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}/featured"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "is_featured": true,
      "featured_order": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('is_featured = true', () => pm.expect(d.is_featured).to.eql(true));
    language: text/javascript
order: 1000
