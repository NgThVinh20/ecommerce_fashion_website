$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "ACTIVE"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('ACTIVE', () => pm.expect(d.status).to.eql('ACTIVE'));
    language: text/javascript
order: 5000
