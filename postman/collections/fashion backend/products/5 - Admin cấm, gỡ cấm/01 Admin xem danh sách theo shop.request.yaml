$kind: http-request
url: "{{baseUrl}}/api/v1/admin/products?status=ACTIVE&q=ao thun"
method: GET
queryParams:
  status: ACTIVE
  q: ao thun
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Có sản phẩm', () => pm.expect(pm.response.json().data.map(p => p.id_product)).to.include(Number(pm.environment.get('productId'))));
    language: text/javascript
order: 1000
