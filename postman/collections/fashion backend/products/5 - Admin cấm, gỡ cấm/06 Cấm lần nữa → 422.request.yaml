$kind: http-request
url: "{{baseUrl}}/api/v1/admin/products/{{productId}}/ban"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Dùng ảnh của thương hiệu khác"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi PRODUCT_NOT_BANNABLE', () => pm.expect(pm.response.json().error.code).to.eql('PRODUCT_NOT_BANNABLE'));
    language: text/javascript
order: 6000
