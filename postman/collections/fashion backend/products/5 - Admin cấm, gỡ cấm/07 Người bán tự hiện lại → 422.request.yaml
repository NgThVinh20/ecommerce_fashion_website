$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "ACTIVE"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi PRODUCT_BANNED', () => pm.expect(pm.response.json().error.code).to.eql('PRODUCT_BANNED'));
    language: text/javascript
order: 7000
