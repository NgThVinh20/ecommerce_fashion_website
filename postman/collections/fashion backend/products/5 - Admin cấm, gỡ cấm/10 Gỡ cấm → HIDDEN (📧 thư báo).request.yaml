$kind: http-request
url: "{{baseUrl}}/api/v1/admin/products/{{productId}}/unban"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('HIDDEN', () => pm.expect(d.status).to.eql('HIDDEN'));
      pm.test('Xóa lý do', () => pm.expect(d.ban_reason).to.eql(null));
    language: text/javascript
order: 10000
