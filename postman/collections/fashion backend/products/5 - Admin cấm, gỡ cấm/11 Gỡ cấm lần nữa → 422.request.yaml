$kind: http-request
url: "{{baseUrl}}/api/v1/admin/products/{{productId}}/unban"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi PRODUCT_NOT_BANNED', () => pm.expect(pm.response.json().error.code).to.eql('PRODUCT_NOT_BANNED'));
    language: text/javascript
order: 11000
