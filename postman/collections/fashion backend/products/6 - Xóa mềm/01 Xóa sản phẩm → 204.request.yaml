$kind: http-request
url: "{{baseUrl}}/api/v1/seller/products/{{productId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 1000
