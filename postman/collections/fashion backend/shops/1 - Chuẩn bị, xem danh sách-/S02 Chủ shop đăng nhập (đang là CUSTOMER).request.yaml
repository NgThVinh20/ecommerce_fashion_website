$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{myEmail}}",
      "password": "{{myPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const t = pm.response.json().data.accessToken;
      pm.environment.set('myToken', t);
      const p = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      pm.test('Token mang role CUSTOMER', () => pm.expect(p.role).to.eql('CUSTOMER'));
    language: text/javascript
order: 2000
