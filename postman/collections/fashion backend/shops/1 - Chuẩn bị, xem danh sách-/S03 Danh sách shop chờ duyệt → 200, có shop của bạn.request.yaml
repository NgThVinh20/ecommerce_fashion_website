$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops?status=PENDING&limit=100"
method: GET
queryParams:
  status: PENDING
  limit: "100"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('Có meta phân trang', () => pm.expect(b.meta).to.include.keys('page','limit','total','total_pages'));
      pm.test('Chỉ toàn shop PENDING', () => b.data.forEach(s => pm.expect(s.status).to.eql('PENDING')));
      const mine = b.data.find(s => s.user.email === pm.environment.get('myEmail'));
      pm.test('Tìm thấy shop của bạn (sai: chưa chạy SQL chuẩn bị)', () => pm.expect(mine).to.be.an('object'));
      if (mine) { pm.environment.set('shopId', mine.id_shop); pm.environment.set('shopSlug', mine.slug); }
    language: text/javascript
order: 3000
