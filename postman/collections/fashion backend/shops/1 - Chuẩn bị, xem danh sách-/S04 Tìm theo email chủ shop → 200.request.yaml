$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops?q={{myEmail}}"
method: GET
queryParams:
  q: "{{myEmail}}"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Có đúng shop', () => pm.expect(pm.response.json().data.map(s => s.id_shop)).to.include(Number(pm.environment.get('shopId'))));
    language: text/javascript
order: 4000
