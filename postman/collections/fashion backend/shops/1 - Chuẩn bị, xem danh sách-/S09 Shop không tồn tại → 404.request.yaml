$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops/99999999"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 404', () => pm.response.to.have.status(404));
      pm.test('Mã lỗi SHOP_NOT_FOUND', () => pm.expect(pm.response.json().error.code).to.eql('SHOP_NOT_FOUND'));
    language: text/javascript
order: 9000
