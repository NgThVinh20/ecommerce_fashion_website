$kind: http-request
name: 08 Đăng ký đầy đủ → 201 PENDING (đã có shop → 409, dùng lại shopId)
url: "{{baseUrl}}/api/v1/shops"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "shop_name": "{{shopName}}",
      "description": "Shop quần áo nam nữ",
      "address": "Số 1 Nghiêm Xuân Yêm, Hoàng Mai, Hà Nội",
      "phone_number": "0912345678",
      "tax_code": "0123456789",
      "bank_name": "Vietcombank",
      "bank_account_number": "0123456789",
      "bank_account_name": "Nguyễn Thành Vinh"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      const code = pm.response.code;
      pm.test('201 (tạo mới) hoặc 409 SHOP_EXISTS (tài khoản đã có shop)', () => pm.expect([201, 409]).to.include(code));
      if (code === 201) {
        const d = pm.response.json().data;
        pm.test('Trạng thái PENDING', () => pm.expect(d.status).to.eql('PENDING'));
        pm.test('Tên chủ TK in hoa, không dấu', () => pm.expect(d.bank_account_name).to.eql('NGUYEN THANH VINH'));
        pm.test('Có slug', () => pm.expect(d.slug).to.be.a('string').and.not.empty);
        pm.test('Chưa tính lần đổi tên / đổi ngân hàng', () => { pm.expect(d.name_updated_at).to.eql(null); pm.expect(d.bank_updated_at).to.eql(null); });
        pm.environment.set('shopId', d.id_shop); pm.environment.set('shopSlug', d.slug);
      } else {
        pm.test('Mã lỗi SHOP_EXISTS', () => pm.expect(pm.response.json().error.code).to.eql('SHOP_EXISTS'));
        pm.sendRequest({ url: pm.environment.get('baseUrl') + '/api/v1/shops/info', method: 'GET', header: { Authorization: 'Bearer ' + pm.environment.get('myToken') } }, (err, res) => {
          if (!err && res.code === 200) { const d = res.json().data; pm.environment.set('shopId', d.id_shop); pm.environment.set('shopSlug', d.slug); }
          pm.test('Đã lấy shopId của shop hiện có', () => pm.expect(pm.environment.get('shopId')).to.not.be.oneOf([undefined, null, '']));
        });
      }
    language: text/javascript
order: 8000
