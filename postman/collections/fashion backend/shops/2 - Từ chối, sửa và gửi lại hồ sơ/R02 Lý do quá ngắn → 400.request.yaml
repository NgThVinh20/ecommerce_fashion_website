$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops/{{shopId}}/reject"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "abc"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
