$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops/{{shopId}}/reject"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Thông tin tài khoản ngân hàng chưa khớp với chủ shop"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Trạng thái REJECTED', () => pm.expect(d.status).to.eql('REJECTED'));
      pm.test('Lưu lý do', () => pm.expect(d.reject_reason).to.eql('Thông tin tài khoản ngân hàng chưa khớp với chủ shop'));
    language: text/javascript
order: 3000
