$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops/{{shopId}}/reject"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Thông tin tài khoản ngân hàng chưa khớp với chủ shop"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi SHOP_NOT_PENDING', () => pm.expect(pm.response.json().error.code).to.eql('SHOP_NOT_PENDING'));
    language: text/javascript
order: 4000
