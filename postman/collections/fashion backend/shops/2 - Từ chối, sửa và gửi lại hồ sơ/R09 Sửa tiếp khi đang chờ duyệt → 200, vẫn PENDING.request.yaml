$kind: http-request
url: "{{baseUrl}}/api/v1/shops/info"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Sửa khi đang chờ duyệt"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Trạng thái PENDING', () => pm.expect(d.status).to.eql('PENDING'));
      pm.test('Mô tả đã đổi', () => pm.expect(d.description).to.eql('Sửa khi đang chờ duyệt'));
    language: text/javascript
order: 9000
