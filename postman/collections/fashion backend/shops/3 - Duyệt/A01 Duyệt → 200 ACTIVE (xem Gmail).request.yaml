$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops/{{shopId}}/approve"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Trạng thái ACTIVE', () => pm.expect(d.status).to.eql('ACTIVE'));
    language: text/javascript
order: 1000
