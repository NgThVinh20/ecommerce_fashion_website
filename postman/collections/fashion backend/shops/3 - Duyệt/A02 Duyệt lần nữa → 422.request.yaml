$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops/{{shopId}}/approve"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi SHOP_NOT_PENDING', () => pm.expect(pm.response.json().error.code).to.eql('SHOP_NOT_PENDING'));
    language: text/javascript
order: 2000
