$kind: http-request
name: A06 Đã duyệt mà sửa qua /shops/info → 403 (phải dùng /seller/shop)
url: "{{baseUrl}}/api/v1/shops/info"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "x"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000
