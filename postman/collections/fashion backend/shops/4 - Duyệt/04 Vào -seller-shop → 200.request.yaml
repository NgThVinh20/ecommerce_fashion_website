$kind: http-request
name: 04 Vào /seller/shop → 200
url: "{{baseUrl}}/api/v1/seller/shop"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Trạng thái ACTIVE', () => pm.expect(d.status).to.eql('ACTIVE'));
    language: text/javascript
order: 4000
