$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops/{{shopId}}/lock"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 400', () => pm.response.to.have.status(400));
      pm.test('Mã lỗi VALIDATION_ERROR', () => pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR'));
    language: text/javascript
order: 1000
