$kind: http-request
name: L04 Chủ shop vào /seller/shop → 403
url: "{{baseUrl}}/api/v1/seller/shop"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 403', () => pm.response.to.have.status(403));
      pm.test('Mã lỗi SHOP_NOT_ACTIVE', () => pm.expect(pm.response.json().error.code).to.eql('SHOP_NOT_ACTIVE'));
    language: text/javascript
order: 4000
