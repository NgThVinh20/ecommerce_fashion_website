$kind: http-request
url: "{{baseUrl}}/api/v1/shops/info"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Trạng thái LOCKED', () => pm.expect(d.status).to.eql('LOCKED'));
      pm.test('Thấy lock_reason', () => pm.expect(d.lock_reason).to.be.a('string'));
    language: text/javascript
order: 5000
