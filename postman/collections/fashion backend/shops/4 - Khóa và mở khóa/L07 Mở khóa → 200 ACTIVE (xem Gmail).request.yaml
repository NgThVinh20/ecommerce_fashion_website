$kind: http-request
url: "{{baseUrl}}/api/v1/admin/shops/{{shopId}}/unlock"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Trạng thái ACTIVE', () => pm.expect(d.status).to.eql('ACTIVE'));
      pm.test('Xóa lock_reason', () => pm.expect(d.lock_reason).to.eql(null));
    language: text/javascript
order: 7000
