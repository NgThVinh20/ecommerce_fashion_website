$kind: http-request
url: "{{baseUrl}}/api/v1/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "Test cấp 3 {{catTs}}",
      "id_categories_parent": {{cat2}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 201', () => pm.response.to.have.status(201));
      pm.environment.set('cat3', pm.response.json().data.id_category);
    language: text/javascript
order: 3000
