$kind: http-request
url: "{{baseUrl}}/api/v1/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "category_name": "Test cấp 4 {{catTs}}",
      "id_categories_parent": {{cat3}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi MAX_LEVEL_EXCEEDED', () => pm.expect(pm.response.json().error.code).to.eql('MAX_LEVEL_EXCEEDED'));
    language: text/javascript
order: 4000
