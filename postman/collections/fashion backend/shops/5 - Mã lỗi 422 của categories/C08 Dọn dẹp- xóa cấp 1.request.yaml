$kind: http-request
name: "C08 Dọn dẹp: xóa cấp 1"
url: "{{baseUrl}}/api/v1/admin/categories/{{cat1}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 8000
