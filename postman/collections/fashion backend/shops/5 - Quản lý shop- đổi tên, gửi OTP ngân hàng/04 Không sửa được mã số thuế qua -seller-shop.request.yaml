$kind: http-request
name: 04 Không sửa được mã số thuế qua /seller/shop
url: "{{baseUrl}}/api/v1/seller/shop"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tax_code": "9999999999",
      "description": "Thử sửa MST"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Mã số thuế giữ nguyên', () => pm.expect(pm.response.json().data.tax_code).to.eql('0123456789'));
    language: text/javascript
order: 4000
