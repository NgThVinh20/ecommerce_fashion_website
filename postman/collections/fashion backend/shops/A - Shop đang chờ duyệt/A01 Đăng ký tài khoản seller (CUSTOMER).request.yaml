$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullname": "Seller Test",
      "email": "{{sellerEmail}}",
      "password": "Matkhau@123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 201', () => pm.response.to.have.status(201));
    language: text/javascript
  - type: beforeRequest
    code: |-
      const ts = Date.now();
      pm.environment.set('sellerEmail', `seller${ts}@test.local`);
      pm.environment.set('shopName', `Shop Test ${ts}`);
    language: text/javascript
order: 1000
