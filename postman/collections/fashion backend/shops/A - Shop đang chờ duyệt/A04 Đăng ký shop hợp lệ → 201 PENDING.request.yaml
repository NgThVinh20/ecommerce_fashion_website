$kind: http-request
url: "{{baseUrl}}/api/v1/shops"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "shop_name": "{{shopName}}",
      "description": "Shop quần áo nam nữ",
      "address": "Số 1 Nghiêm Xuân Yêm, Hoàng Mai, Hà Nội",
      "phone_number": "0912345678"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 201', () => pm.response.to.have.status(201));
      const d = pm.response.json().data;
      pm.test('Trạng thái PENDING', () => pm.expect(d.status).to.eql('PENDING'));
      pm.test('Có slug', () => pm.expect(d.slug).to.be.a('string').and.not.empty);
      pm.environment.set('shopSlug', d.slug);
      console.log('SQL duyệt shop (chạy trong DBeaver trước khi chạy thư mục B):');
      console.log(`UPDATE shops SET status = 'ACTIVE' WHERE id_user = (SELECT id_user FROM users WHERE email = '${pm.environment.get('sellerEmail')}');`);
      console.log(`UPDATE users SET role = 'SELLER' WHERE email = '${pm.environment.get('sellerEmail')}';`);
    language: text/javascript
order: 4000
