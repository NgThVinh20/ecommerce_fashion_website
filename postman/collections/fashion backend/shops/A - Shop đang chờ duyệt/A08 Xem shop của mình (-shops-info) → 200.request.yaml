$kind: http-request
name: A08 Xem shop của mình (/shops/info) → 200
url: "{{baseUrl}}/api/v1/shops/info"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Đúng shop vừa tạo, PENDING', () => { const d = pm.response.json().data; pm.expect(d.slug).to.eql(pm.environment.get('shopSlug')); pm.expect(d.status).to.eql('PENDING'); });
    language: text/javascript
order: 8000
