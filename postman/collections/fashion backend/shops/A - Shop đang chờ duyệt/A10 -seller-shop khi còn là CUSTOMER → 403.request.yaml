$kind: http-request
name: A10 /seller/shop khi còn là CUSTOMER → 403
url: "{{baseUrl}}/api/v1/seller/shop"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 10000
