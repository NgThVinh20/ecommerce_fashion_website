$kind: http-request
url: "{{baseUrl}}/api/v1/shops"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "shop_name": "{{shopName}}",
      "description": "Shop quần áo nam nữ",
      "address": "Số 1 Nghiêm Xuân Yêm, Hoàng Mai, Hà Nội",
      "phone_number": "0912345678"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Mã trạng thái 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 12000
