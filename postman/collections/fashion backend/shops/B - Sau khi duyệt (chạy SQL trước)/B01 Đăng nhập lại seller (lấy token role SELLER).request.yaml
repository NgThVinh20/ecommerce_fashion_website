$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{sellerEmail}}",
      "password": "Matkhau@123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.environment.set('sellerToken', d.accessToken);
      const payload = JSON.parse(atob(d.accessToken.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      pm.test('Token mang role SELLER (nếu sai: chưa chạy SQL duyệt)', () => pm.expect(payload.role).to.eql('SELLER'));
    language: text/javascript
order: 1000
