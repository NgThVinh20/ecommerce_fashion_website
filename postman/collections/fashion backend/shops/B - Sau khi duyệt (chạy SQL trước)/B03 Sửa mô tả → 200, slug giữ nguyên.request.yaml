$kind: http-request
url: "{{baseUrl}}/api/v1/seller/shop"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Mô tả mới sau khi sửa"
    }
auth:
  type: bearer
  credentials:
    token: "{{sellerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Mô tả đã đổi', () => pm.expect(d.description).to.eql('Mô tả mới sau khi sửa'));
      pm.test('Slug không đổi', () => pm.expect(d.slug).to.eql(pm.environment.get('shopSlug')));
    language: text/javascript
order: 3000
