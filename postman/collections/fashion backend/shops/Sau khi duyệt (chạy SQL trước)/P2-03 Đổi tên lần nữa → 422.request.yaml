$kind: http-request
url: "{{baseUrl}}/api/v1/seller/shop"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "shop_name": "Ten Khac {{$timestamp}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi SHOP_RENAME_TOO_SOON', () => pm.expect(pm.response.json().error.code).to.eql('SHOP_RENAME_TOO_SOON'));
    language: text/javascript
order: 3000
