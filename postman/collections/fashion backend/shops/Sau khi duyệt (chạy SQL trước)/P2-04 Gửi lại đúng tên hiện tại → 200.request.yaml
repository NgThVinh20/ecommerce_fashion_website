$kind: http-request
url: "{{baseUrl}}/api/v1/seller/shop"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "shop_name": "{{newShopName}}",
      "description": "Mô tả mới"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      pm.test('Mô tả đã đổi', () => pm.expect(pm.response.json().data.description).to.eql('Mô tả mới'));
    language: text/javascript
order: 4000
