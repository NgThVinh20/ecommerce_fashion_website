$kind: http-request
name: P2-06 Trang công khai → 200, không lộ thông tin nhạy cảm
url: "{{baseUrl}}/api/v1/shops/{{shopSlug}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Không có tax_code', () => pm.expect(d).to.not.have.property('tax_code'));
      pm.test('Không có bank_name', () => pm.expect(d).to.not.have.property('bank_name'));
      pm.test('Không có bank_account_number', () => pm.expect(d).to.not.have.property('bank_account_number'));
      pm.test('Không có bank_account_name', () => pm.expect(d).to.not.have.property('bank_account_name'));
      pm.test('Không có pending_balance', () => pm.expect(d).to.not.have.property('pending_balance'));
      pm.test('Không có available_balance', () => pm.expect(d).to.not.have.property('available_balance'));
      pm.test('Không có id_user', () => pm.expect(d).to.not.have.property('id_user'));
    language: text/javascript
order: 6000
