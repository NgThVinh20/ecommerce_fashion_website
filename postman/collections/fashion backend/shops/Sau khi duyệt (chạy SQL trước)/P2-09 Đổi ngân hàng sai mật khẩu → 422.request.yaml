$kind: http-request
url: "{{baseUrl}}/api/v1/seller/shop/bank"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "SaiMatKhau123",
      "otp": "000000",
      "bank_name": "Techcombank",
      "bank_account_number": "1903123456789",
      "bank_account_name": "Nguyễn Thành Vinh"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi INVALID_PASSWORD', () => pm.expect(pm.response.json().error.code).to.eql('INVALID_PASSWORD'));
    language: text/javascript
order: 9000
