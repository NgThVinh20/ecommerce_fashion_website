$kind: http-request
url: "{{baseUrl}}/api/v1/seller/shop"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "shop_name": "{{otherShopName}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 409', () => pm.response.to.have.status(409));
      pm.test('Mã lỗi SHOP_NAME_EXISTS', () => pm.expect(pm.response.json().error.code).to.eql('SHOP_NAME_EXISTS'));
    language: text/javascript
order: 1000
