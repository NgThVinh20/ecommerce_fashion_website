$kind: http-request
url: "{{baseUrl}}/api/v1/seller/shop/bank"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "{{myPassword}}",
      "otp": "{{wrongOtp}}",
      "bank_name": "Techcombank",
      "bank_account_number": "1903123456789",
      "bank_account_name": "Nguyễn Thành Vinh"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi OTP_INVALID', () => pm.expect(pm.response.json().error.code).to.eql('OTP_INVALID'));
    language: text/javascript
  - type: beforeRequest
    code: |-
      const c = pm.environment.get('bankOtp');
      pm.environment.set('wrongOtp', c === '000000' ? '111111' : '000000');
    language: text/javascript
order: 1000
