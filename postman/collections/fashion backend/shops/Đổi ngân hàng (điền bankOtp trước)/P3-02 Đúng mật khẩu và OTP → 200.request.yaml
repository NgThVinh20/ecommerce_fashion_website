$kind: http-request
url: "{{baseUrl}}/api/v1/seller/shop/bank"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "{{myPassword}}",
      "otp": "{{bankOtp}}",
      "bank_name": "Techcombank",
      "bank_account_number": "1903123456789",
      "bank_account_name": "Nguyễn Thành Vinh"
    }
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('Ngân hàng mới', () => { pm.expect(d.bank_name).to.eql('Techcombank'); pm.expect(d.bank_account_number).to.eql('1903123456789'); });
      pm.test('Tên chủ TK in hoa, không dấu', () => pm.expect(d.bank_account_name).to.eql('NGUYEN THANH VINH'));
      pm.test('Có bank_updated_at', () => pm.expect(d.bank_updated_at).to.be.a('string'));
      console.log('Kiểm tra Gmail: phải có thư thông báo đổi ngân hàng, số tài khoản bị che ****6789.');
    language: text/javascript
order: 2000
