$kind: http-request
url: "{{baseUrl}}/api/v1/seller/shop/bank/otp"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{myToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Mã trạng thái 422', () => pm.response.to.have.status(422));
      pm.test('Mã lỗi BANK_UPDATE_TOO_SOON', () => pm.expect(pm.response.json().error.code).to.eql('BANK_UPDATE_TOO_SOON'));
    language: text/javascript
order: 4000
